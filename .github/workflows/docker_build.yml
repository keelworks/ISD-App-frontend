name: Build & (Conditionally) Push Docker image

on:
  push:
    branches:
      - main                  # publish to registry
      - Docker_build_workflow # your working branch (build only)
    tags:
      - 'v*'                  # e.g., v1.2.3 -> publish tagged image
  pull_request:
    branches:
      - main                  # build on PRs targeting main
  workflow_dispatch:

permissions:
  contents: read
  packages: write            # needed to push to GHCR
  id-token: write            # optional (future: keyless signing)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # human-friendly tag for main
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # immutable tag by commit
            type=sha,format=long
            # release tag when pushing v*
            type=ref,event=tag

      - name: Build (always) & Push (only on main or tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # 👉 push only for main or tags; feature branches/PRs just build to validate
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
